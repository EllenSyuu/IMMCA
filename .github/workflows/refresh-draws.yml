name: Refresh Express Entry rounds

# Pulls IRCC's public rounds feed every Monday and commits the result if it changed.
# The script refuses to write anything if the feed is unreachable or its shape changed,
# so a failed run leaves the last good data in place and shows up as a red check.
on:
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run refresh:draws
      - name: Verify
        run: npx vitest run tests/draws.test.ts tests/programs.test.ts
      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/draws.json; then
            echo "No new rounds."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/draws.json
          git commit -m "data: refresh Express Entry rounds from IRCC feed"
          git push
