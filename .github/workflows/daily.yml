name: Daily update

# Every morning (≈ 07:17 Eastern):
#   1. refresh Express Entry rounds and the CRS pool distribution from IRCC's feed;
#   2. check every official page a program rule cites, flagging pages that changed;
#   3. commit real changes (new rounds, changed or unreachable pages, text snapshots);
#   4. open an issue listing newly changed pages for review;
#   4b. log the day's changes, which become calendar (iCal) and RSS feed entries;
#   5. rebuild and redeploy the site and feeds, so the "last checked" date is always current
#      (skipped with a warning, not a failure, if GitHub Pages is not enabled).
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Refresh Express Entry rounds
        run: npm run refresh:draws || echo "::warning::IRCC rounds feed could not be refreshed; keeping the last good data"

      - name: Check official sources
        run: npm run sources:check

      - name: Record what changed today (for calendar and RSS subscribers)
        run: npm run log:update

      - name: Test with the new data
        run: npx vitest run

      - name: Collect usage stats for the README
        env:
          COUNTER_URL: ${{ vars.COUNTER_URL }}
        run: |
          if [ -z "$COUNTER_URL" ]; then
            echo "Counter not set up yet (repository variable COUNTER_URL is empty); skipping."
          else
            node scripts/collect-stats.mjs || echo "::warning::Could not read the counter's stats; keeping yesterday's numbers"
          fi

      - name: Commit changes
        run: |
          git add src/data/draws.json src/data/source-status.json src/data/updates-log.json monitor/snapshots stats
          if git diff --cached --quiet; then
            echo "No data changes today."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: daily update $(date -u +%F)"
            git push
          fi

      - name: Report newly changed official pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s monitor/new-changes.md ]; then
            gh label create source-change --color d93f0b --description "An official page cited by a rule changed" --force
            gh issue create --title "Official pages changed — $(date -u +%F)" --label source-change --body-file monitor/new-changes.md
          fi

      - run: npm run build
        env:
          # Address of the usage counter (repository variable); empty = no counting.
          VITE_COUNTER_URL: ${{ vars.COUNTER_URL }}
      - name: Check that GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || true)
          if [ "$source" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Pages not enabled::GitHub Pages is not enabled with 'GitHub Actions' as its source, so the site was built but not deployed. Enable it in Settings → Pages → Source: GitHub Actions, then re-run this workflow."
          fi
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: update
    if: needs.update.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
